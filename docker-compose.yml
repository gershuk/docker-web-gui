services:
  docker-web-gui:
    container_name: docker-web-gui
    build:
      context: .
    ports:
      - "3230:3230"
    environment:
      # Values come from the project-root .env file (docker-compose reads it
      # automatically). Override inline with e.g. `AUTH_PASSWORD=... docker compose up -d`.
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-180}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Персистентная БД: аккаунт и сессии переживают пересоздание контейнера.
      - docker-web-gui-data:/src/backend/data
    restart: always  # This ensures the container auto-starts and restarts on failure

volumes:
  docker-web-gui-data:
